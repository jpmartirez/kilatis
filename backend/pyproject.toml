[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.0",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.0",
    "pyjwt>=2.10.0",
    "pwdlib[bcrypt]>=0.2.0",
    "bcrypt>=4.0.0",
    "python-dotenv>=1.0.0",
    "reportlab>=5.0.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "timm>=1.0.28",
    "pywavelets>=1.9.0",
    "scipy>=1.18.0",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "numpy>=2.5.2",
    "python-multipart>=0.0.32",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "albumentations>=2.0.8",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "modal>=1.5.5",
    "pillow-heif>=1.7.0",
    "svglib>=2.2.0",
    "rlpycairo>=0.4.0",
    # KILATIS learned decision layer + Branch 2 (TruFor via IMDLBenCo)
    "scikit-learn==1.9.0",  # MUST match the version used to save app/ai/weights/decider.joblib
    "joblib>=1.5",
    "imdlbenco==0.1.45",
    "fvcore",
    "colorama",
]

[tool.uv]
# IMDLBenCo pins numpy<2 and albumentations==1.3.0, which break this environment.
override-dependencies = ["numpy>=2.5.2", "albumentations>=2.0.8"]
